queue_rules:
  - name: default
    queue_conditions:
      - base = main
      - '#approved-reviews-by >= 1'
      - check-success = 0x19-precheck
    merge_conditions:
      - check-success = 0x19-never
    batch_size: 1

pull_request_rules:
  - name: autoqueue
    conditions:
      - base = main
    actions:
      queue:
        name: default
